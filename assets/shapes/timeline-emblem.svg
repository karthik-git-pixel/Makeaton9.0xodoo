<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220" role="img" aria-label="Timeline medallion">
  <defs>
    <!-- One chapter marker: ink ring, coloured core, a highlight on top -->
    <g id="te-node">
      <circle r="13" fill="#0C0E0F"/>
      <circle r="9.5" fill="currentColor"/>
      <circle cx="-3" cy="-3.2" r="2.8" fill="#FFFFFF" opacity="0.9"/>
    </g>
    <path id="te-star" d="M0-26C4.4-7.6 7.6-4.4 26 0C7.6 4.4 4.4 7.6 0 26C-4.4 7.6-7.6 4.4-26 0C-7.6-4.4-4.4-7.6 0-26Z"/>
    <pattern id="te-halftone" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#0C0E0F" opacity="0.14"/>
    </pattern>
    <clipPath id="te-field"><circle cx="106" cy="106" r="72"/></clipPath>
  </defs>

  <!-- Comic drop shadow, then the yellow rim -->
  <circle cx="113" cy="116" r="94" fill="#0C0E0F"/>
  <circle cx="106" cy="106" r="94" fill="#FFE23A" stroke="#0C0E0F" stroke-width="7"/>

  <!-- Clock ticks around the rim -->
  <g stroke="#0C0E0F" stroke-linecap="round">
    <g stroke-width="6">
      <path d="M106 20v14M106 178v14M20 106h14M178 106h14"/>
      <path d="M48 48l10 10M154 154l10 10M164 48l-10 10M58 154l-10 10"/>
    </g>
    <g stroke-width="3.4" opacity="0.6">
      <path d="M63 26l5 9M144 177l5 9M26 63l9 5M177 144l9 5M149 26l-5 9M68 177l-5 9M186 63l-9 5M35 144l-9 5"/>
    </g>
  </g>

  <!-- Inner field, with halftone and a soft sunburst -->
  <circle cx="106" cy="106" r="72" fill="#FFF8EE"/>
  <g clip-path="url(#te-field)">
    <g fill="#FCC230" opacity="0.32">
      <path d="M106 106L34 78 34 50Z"/><path d="M106 106L52 34 78 34Z"/>
      <path d="M106 106L134 34 162 48Z"/><path d="M106 106L178 62 178 92Z"/>
      <path d="M106 106L178 134 162 160Z"/><path d="M106 106L130 178 102 178Z"/>
      <path d="M106 106L62 178 44 158Z"/><path d="M106 106L34 130 34 114Z"/>
    </g>
    <rect x="34" y="34" width="144" height="144" fill="url(#te-halftone)"/>
  </g>
  <circle cx="106" cy="106" r="72" fill="none" stroke="#0C0E0F" stroke-width="5"/>

  <!-- The route: chapters climbing from the first to the last. Two copies, not a
       <use>: stroke attributes set on the path itself would win over the <use>. -->
  <path d="M64 150C64 126 92 132 94 112C96 90 122 96 128 76"
        fill="none" stroke="#FFF8EE" stroke-width="14" stroke-linecap="round" opacity="0.95"/>
  <path d="M64 150C64 126 92 132 94 112C96 90 122 96 128 76"
        fill="none" stroke="#0C0E0F" stroke-width="7" stroke-linecap="round" stroke-dasharray="0.1 14"/>
  <use href="#te-node" x="64" y="150" color="#FA5C94"/>
  <use href="#te-node" x="94" y="112" color="#4080FB"/>
  <use href="#te-node" x="128" y="76" color="#22AC5F"/>

  <!-- Finish: a star stuck over the rim where the route runs out -->
  <g transform="translate(156 46)">
    <use href="#te-star" transform="translate(5 6) scale(1.08)" fill="#0C0E0F"/>
    <use href="#te-star" fill="#EF4225" stroke="#0C0E0F" stroke-width="5.5" stroke-linejoin="round" paint-order="stroke"/>
    <use href="#te-star" transform="translate(-6 -7) scale(0.2)" fill="#FFF8EE" opacity="0.9"/>
  </g>

  <!-- Sparkles in the quiet corners -->
  <g fill="#0C0E0F">
    <use href="#te-star" transform="translate(62 76) scale(0.26)"/>
    <use href="#te-star" transform="translate(150 140) scale(0.3)"/>
    <use href="#te-star" transform="translate(104 170) scale(0.2)"/>
  </g>
</svg>
